<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindling Quest</title>
    <meta name="description" content="A cognitive adventure game for kids — train your brain with fun!" />
    <meta name="author" content="Mindling Quest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

    <meta property="og:title" content="Mindling Quest" />
    <meta property="og:description" content="A cognitive adventure game for kids" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- Early font load so the loader text renders styled immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Inline loader styles — rendered before any JS executes -->
    <style>
      body { margin: 0; }
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: hsl(232 55% 10%);
        font-family: 'Baloo 2', 'Quicksand', sans-serif;
        overflow: hidden;
        /* Fade-out transition driven by JS adding .loader-exit class */
        transition: opacity 0.5s ease, visibility 0s 0.5s;
      }
      #app-loader.loader-exit {
        opacity: 0;
        visibility: hidden;
      }

      /* Pulsing glass orb */
      .loader-orb {
        width: 72px; height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%,
          hsla(48,100%,88%,0.95) 0%,
          hsla(282,80%,78%,0.7) 45%,
          hsla(200,90%,70%,0.4) 75%,
          transparent 100%);
        box-shadow:
          0 0 40px hsla(48,100%,65%,0.6),
          0 0 80px hsla(282,80%,65%,0.3),
          inset 0 -8px 16px hsla(200,90%,60%,0.3);
        animation: loaderPulse 2s ease-in-out infinite;
        margin-bottom: 24px;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50%      { transform: scale(1.15); opacity: 1; }
      }

      /* Title text */
      .loader-title {
        font-size: 1.5rem; font-weight: 700;
        color: hsl(42 100% 80%);
        letter-spacing: 0.04em;
        margin: 0 0 20px 0;
        text-shadow: 0 2px 12px hsla(42,100%,55%,0.35);
      }

      /* Bouncing dots */
      .loader-dots { display: flex; gap: 8px; }
      .loader-dots span {
        width: 10px; height: 10px; border-radius: 50%;
        background: hsl(200 90% 78%);
        box-shadow: 0 0 12px hsla(200,90%,70%,0.5);
        animation: loaderBounce 1.2s ease-in-out infinite;
      }
      .loader-dots span:nth-child(2) { animation-delay: 0.15s; background: hsl(282 80% 82%); box-shadow: 0 0 12px hsla(282,80%,70%,0.5); }
      .loader-dots span:nth-child(3) { animation-delay: 0.3s; background: hsl(48 100% 80%); box-shadow: 0 0 12px hsla(48,100%,65%,0.5); }
      @keyframes loaderBounce {
        0%, 80%, 100% { transform: translateY(0) scale(1); }
        40% { transform: translateY(-14px) scale(1.2); }
      }

      /* Subtle pastel gradient wash drifting behind the orb */
      .loader-wash {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse at 40% 40%, hsla(48,100%,75%,0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 65% 60%, hsla(282,80%,70%,0.06) 0%, transparent 50%);
        animation: loaderWashShift 6s ease-in-out infinite alternate;
      }
      @keyframes loaderWashShift {
        0%   { opacity: 0.6; transform: scale(1) translate(0, 0); }
        100% { opacity: 1;   transform: scale(1.15) translate(20px, -10px); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Instant loader — visible before any JS/CSS bundle loads.
         Removed by React once critical assets are ready. -->
    <div id="app-loader">
      <div class="loader-wash"></div>
      <div class="loader-orb"></div>
      <p class="loader-title">Mindscape of Mindlings</p>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
